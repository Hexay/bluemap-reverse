[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# iterate on debug builds: deps optimised once, our crates lightly optimised (reverse runs on millions of faces)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# benchmarks: full optimisation
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# sampling profiles (tools/profile.py): release code + full debug info so samply can name functions
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
fastnbt = "2.6"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.18"
rayon = "1"
# FxHash for integer-keyed maps in hot paths (profile: SipHash was ~5% self time)
rustc-hash = "2"
# ureq over reqwest: reqwest (tokio/hyper) took minutes per build here, and rustls pulls aws-lc-sys (CMake C build).
# No "gzip" feature: see bmr-fetch/src/http.rs. native-tls = SChannel on Windows.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
# pack files (bmr-pack): compact serde binary; bincode 3.0.0 is an empty tombstone release
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# deflate via flate2 only: the default features pull C builds (bzip2, zstd) and crypto we don't need
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
bmr-cubiomes = { path = "crates/bmr-cubiomes" }
bmr-fetch = { path = "crates/bmr-fetch" }
bmr-fill = { path = "crates/bmr-fill" }
bmr-invert = { path = "crates/bmr-invert" }
bmr-pack = { path = "crates/bmr-pack" }
bmr-prbm = { path = "crates/bmr-prbm" }
bmr-score = { path = "crates/bmr-score" }
bmr-seed = { path = "crates/bmr-seed" }
bmr-world = { path = "crates/bmr-world" }
