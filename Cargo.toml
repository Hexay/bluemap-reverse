[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# iterate on debug builds: deps optimised once, our crates compile fast
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.18"
rayon = "1"
# ureq over reqwest: reqwest (tokio/hyper) took minutes per build here, and rustls pulls aws-lc-sys (CMake C build).
# No "gzip" feature: see bmr-fetch/src/http.rs. native-tls = SChannel on Windows.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bmr-fetch = { path = "crates/bmr-fetch" }
bmr-prbm = { path = "crates/bmr-prbm" }
